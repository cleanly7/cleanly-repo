# 黑马点评前端本地预览配置（macOS 版，仅供临时单独启动时使用）
#
# 平时不用它：Homebrew 的 nginx 已经把同样的 server 块放在
#   /opt/homebrew/etc/nginx/servers/hmdp.conf
# 由 launchd 常驻，开机自动监听 8080，不需要敲任何命令。
#
# 只有想临时单独起一个 nginx（比如换端口调试）时，才用这份配置：
#   启动： /opt/homebrew/bin/nginx -c "/Users/macbook/Desktop/开发项目/_cleanly repo/hmdp/nginx.hmdp.conf"
#   重载： /opt/homebrew/bin/nginx -c "<上面的路径>" -s reload
#   停止： /opt/homebrew/bin/nginx -c "<上面的路径>" -s stop
#
# 目录约定：前端页面 hmdp/frontend/   后端 Spring Boot hmdp/backend/（监听 8081）

worker_processes  1;

error_log  "/opt/homebrew/var/log/nginx/hmdp-error.log";
pid        "/opt/homebrew/var/log/nginx/hmdp-nginx.pid";

events {
    worker_connections  1024;
}

http {
    include       "/opt/homebrew/etc/nginx/mime.types";
    default_type  application/json;

    access_log "/opt/homebrew/var/log/nginx/hmdp-access.log";

    sendfile        on;
    keepalive_timeout  65;

    server {
        listen       8080;
        server_name  localhost;

        # 前端页面所在位置
        location / {
            root   "/Users/macbook/Desktop/开发项目/_cleanly repo/hmdp/frontend";
            index  index.html index.htm;
        }

        # 反向代理到本机 Spring Boot 后端（8081）
        location /api {
            default_type  application/json;
            keepalive_timeout   30s;
            keepalive_requests  1000;
            proxy_http_version 1.1;
            rewrite /api(/.*) $1 break;
            proxy_pass_request_headers on;
            proxy_next_upstream error timeout;
            proxy_pass http://127.0.0.1:8081;
        }
    }
}
